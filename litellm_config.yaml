database_url: os.environ/DATABASE_URL

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600

model_list:
 - model_name: gemini-3-pro-preview
   litellm_params:
     model: gemini/gemini-3-pro-preview
     api_key: os.environ/GEMINI_API_KEY
